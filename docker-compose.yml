services:
  test-server:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        RUN pip install flask
        COPY test_server.py .
        COPY templates/ templates/
        EXPOSE 8080
        CMD ["python", "test_server.py"]
    ports:
      - "8080:8080"
    networks:
      - kaktus-network

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      test-server:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://bot:password@db:5432/telegram_bot
      - SCRAPE_URL=http://test-server:8080
      - CHECK_INTERVAL=30
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - kaktus-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kaktus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d telegram_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  kaktus-network:
    driver: bridge